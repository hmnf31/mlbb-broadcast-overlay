<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft Overlay</title>
    <link rel="stylesheet" href="/frontend/shared/apex.css" />
    <link rel="stylesheet" href="/frontend/overlay/draft/styles.css" />
  </head>
  <body>
    <div class="draft-shell" id="draft-shell" data-visible="false">
      <!-- Baris atas: ban kiri, inti fase, ban kanan.
           Ban pindah ke sini supaya urutannya terbaca dari kiri ke kanan seperti di layar
           broadcast: ban BLUE, giliran yang sedang berjalan, ban RED. advantage tetap di
           bawahnya karena angkanya berasal dari matriks kurasi dan harus terlihat Operator. -->
      <header class="draft-header">
        <section class="draft-rail" data-side="blue">
          <div class="draft-rail-badge">
            <span class="draft-rail-name" id="board-blue-title">BLUE</span>
            <span class="board-badge">ALLY</span>
          </div>
          <ol class="board-bans" id="board-blue-bans" aria-label="Ban biru"></ol>
        </section>

        <section class="draft-core">
          <div class="draft-core-turn">
            <span class="draft-phase" id="draft-phase" data-phase="ban">BAN</span>
            <div class="draft-turn">
              <span class="draft-turn-side" id="draft-turn-side" data-side="blue">BLUE</span>
              <span class="draft-turn-step" id="draft-turn-step">1 / 20</span>
            </div>
          </div>
          <span class="draft-chip">LIVE DRAFT</span>
        </section>

        <section class="draft-rail" data-side="red">
          <ol class="board-bans" id="board-red-bans" aria-label="Ban merah"></ol>
          <div class="draft-rail-badge">
            <span class="board-badge board-badge-enemy">ENEMY</span>
            <span class="draft-rail-name" id="board-red-title">RED</span>
          </div>
        </section>
      </header>

      <!-- Advantage. disembunyikan sampai kedua tim punya minimal satu pick, karena angka dari
           satu hero saja terlihat seperti hasil analisis padahal cuma membandingkan satu
           power rating. -->
      <section class="advantage" id="advantage" aria-label="Advantage draft" data-ready="false">
        <div class="advantage-side advantage-side-blue">
          <span class="advantage-team" id="advantage-blue-name">BLUE</span>
          <span class="advantage-value" id="advantage-blue-value">--</span>
        </div>
        <div class="advantage-track">
          <div class="advantage-fill" id="advantage-fill"></div>
          <div class="advantage-mid"></div>
        </div>
        <div class="advantage-side advantage-side-red">
          <span class="advantage-value" id="advantage-red-value">--</span>
          <span class="advantage-team" id="advantage-red-name">RED</span>
        </div>
        <p class="advantage-waiting" id="advantage-waiting">menunggu pick pertama kedua tim</p>
      </section>

      <main class="draft-board">
        <!-- Lima pick BLUE. Urutannya urutan draft, bukan posisi lane, jadi slot tidak
             diberi label EXP/JUNGLE/GOLD yang tidak datanya ada. Yang tampil di pojok slot
             adalah role asli hero dari matriks. -->
        <section class="board-side board-blue" data-side="blue">
          <ol class="board-picks" id="board-blue-picks" aria-label="Pick biru"></ol>
          <div class="board-composition" id="composition-blue"></div>
        </section>

        <!-- Jangkar tengah: jam, arah giliran, skor seri, dan matchup. -->
        <section class="draft-anchor">
          <div class="anchor-timer">
            <span class="anchor-timer-dot" data-running="true"></span>
            <span class="anchor-timer-value" id="draft-timer">00:00</span>
          </div>

          <div class="anchor-turn">
            <span class="anchor-chevron anchor-chevron-idle" aria-hidden="true"></span>
            <div class="anchor-turn-text">
              <span class="anchor-turn-label">DRAFT TURN</span>
              <span class="anchor-turn-phase" id="anchor-turn-phase">BAN</span>
            </div>
            <span class="anchor-chevron anchor-chevron-live" data-side="blue" aria-hidden="true"></span>
          </div>

          <div class="anchor-series">
            <span class="anchor-series-team" id="anchor-blue-name">BLUE</span>
            <span class="anchor-series-bars" id="anchor-series-blue" aria-label=" seri biru"></span>
            <span class="anchor-series-score">SCORE</span>
            <span class="anchor-series-bars" id="anchor-series-red" aria-label="seri merah"></span>
            <span class="anchor-series-team" id="anchor-red-name">RED</span>
          </div>

          <section class="board-matchups">
            <h2 class="board-matchups-title">KEY MATCHUPS</h2>
            <ul class="matchup-list" id="matchup-list"></ul>
          </section>
        </section>

        <section class="board-side board-red" data-side="red">
          <ol class="board-picks" id="board-red-picks" aria-label="Pick merah"></ol>
          <div class="board-composition" id="composition-red"></div>
        </section>
      </main>

      <!-- Rekomendasi. Judul dan isi mengikuti fase yang sedang berjalan: saat gilirannya ban,
           yang tampil adalah hero yang paling berbahaya bagi lawan, bukan hero yang bagus
           untuk kita. -->
      <section class="recommend" id="recommend" data-purpose="ban">
        <h2 class="recommend-title">
          <span class="recommend-action" id="recommend-action">BAN</span>
          <span class="recommend-side" id="recommend-side">BLUE</span>
          <span class="recommend-hint" id="recommend-hint">paling berbahaya kalau lolos</span>
        </h2>
        <ol class="recommend-list" id="recommend-list"></ol>
      </section>

      <!-- Sumber data wajib terlihat: advantage di layar ini berasal dari tabel kurasi, bukan
           statistik pertandingan. -->
      <footer class="draft-footer">
        <span class="draft-source" id="draft-source">matriks: memuat…</span>
      </footer>
    </div>

    <script src="/frontend/shared/profile.js"></script>
    <script src="/frontend/shared/live-socket.js"></script>
    <script src="/frontend/shared/draft-analytics.js"></script>
    <script src="/frontend/overlay/draft/app.js"></script>
  </body>
</html>
